<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Παιχνίδι Λέξεων για Παιδιά</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --background: #F7FFF7;
            --text: #2F2F2F;
        }

        body {
            font-family: 'Comfortaa', cursive;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        #image-container img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--primary);
        }

        #transcript {
            min-height: 50px;
            margin: 15px 0;
            padding: 10px;
            border-bottom: 2px dashed #ccc;
            font-size: 1.4rem;
            color: var(--secondary);
        }

        #message {
            font-weight: bold;
            height: 30px;
            margin-bottom: 15px;
        }

        .btn-mic {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-mic:active {
            transform: scale(0.9);
        }

        .btn-mic.listening {
            background-color: #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="card">
        <div class="score-board">Σκορ: <span id="score">0</span> / <span id="total">0</span></div>
        
        <div id="image-container">
            <img id="quiz-image" src="" alt="Quiz Image">
        </div>

        <div id="transcript">Πάτα το κουμπί και πες τη λέξη!</div>
        <div id="message"></div>

        <button id="start-btn" class="btn-mic">🎤</button>
        <p style="font-size: 0.8rem; margin-top: 15px; color: #888;">Βεβαιωθείτε ότι επιτρέψατε τη χρήση μικροφώνου.</p>
    </div>

    <script>
        // 11. Λίστα Δεδομένων (Εικόνες και Απαντήσεις)
        // Σημείωση: Χρησιμοποιώ placeholders από το Unsplash για το παράδειγμα.
        const quizData = [
            { id: 1, image: "https://images.unsplash.com/photo-1557180295-76eee20ae8aa?w=400", answers: ["μηλο", "μήλο", "μηλα"] },
            { id: 2, image: "https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=400", answers: ["σκυλος", "σκύλος", "σκυλάκι"] },
            { id: 3, image: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400", answers: ["γατα", "γάτα", "γατάκι"] },
            { id: 4, image: "https://images.unsplash.com/photo-1562157873-818bc0726f68?w=400", answers: ["μπλουζα", "μπλούζα", "φανελα"] },
            { id: 5, image: "https://images.unsplash.com/photo-1503919919749-64670745491f?w=400", answers: ["ηλιος", "ήλιος"] }
        ];

        let currentIndex = 0;
        let score = 0;

        const imgElement = document.getElementById('quiz-image');
        const transcriptDiv = document.getElementById('transcript');
        const messageDiv = document.getElementById('message');
        const scoreElement = document.getElementById('score');
        const totalElement = document.getElementById('total');
        const startBtn = document.getElementById('start-btn');

        // Αρχικοποίηση
        function initQuiz() {
            totalElement.innerText = quizData.length;
            loadQuestion();
        }

        function loadQuestion() {
            imgElement.src = quizData[currentIndex].image;
            messageDiv.innerText = "";
            transcriptDiv.innerText = "Περιμένω να ακούσω...";
        }

        // 7. Συνάρτηση Καθαρισμού Κειμένου (Αφαίρεση τόνων)
        function normalizeText(text) {
            return text.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/λλ/g, "λ"); // Ανοχή στο "μπάλλα/μπάλα"
        }

        // 2 & 3. Ρύθμιση Αναγνώρισης Φωνής
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Λυπούμαστε, το πρόγραμμα περιήγησης δεν υποστηρίζει αναγνώριση φωνής. Δοκιμάστε Google Chrome.");
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'el-GR'; // Ελληνικά
        recognition.interimResults = false;

        startBtn.onclick = () => {
            recognition.start();
            startBtn.classList.add('listening');
        };

        recognition.onresult = (event) => {
            startBtn.classList.remove('listening');
            const result = event.results[0][0].transcript;
            transcriptDiv.innerText = result;
            checkAnswer(result);
        };

        recognition.onerror = () => {
            startBtn.classList.remove('listening');
            messageDiv.innerText = "Δεν σε άκουσα, δοκίμασε ξανά!";
            messageDiv.className = "error";
        };

        // 6 & 7. Έλεγχος Απάντησης
        function checkAnswer(spokenText) {
            const cleanSpoken = normalizeText(spokenText);
            const correctAnswers = quizData[currentIndex].answers;
            
            // Έλεγχος αν η ειπωμένη λέξη περιλαμβάνεται στις αποδεκτές απαντήσεις
            const isCorrect = correctAnswers.some(ans => {
                const cleanAns = normalizeText(ans);
                return cleanSpoken.includes(cleanAns) || cleanAns.includes(cleanSpoken);
            });

            if (isCorrect) {
                score++;
                scoreElement.innerText = score;
                messageDiv.innerText = "Μπράβο! Σωστά! 🎉";
                messageDiv.className = "success";
                
                // Αυτόματη μετάβαση μετά από 1.5 δευτερόλεπτο
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        finishQuiz();
                    }
                }, 1500);
            } else {
                messageDiv.innerText = "Δοκίμασε ξανά! 🤔";
                messageDiv.className = "error";
            }
        }

        function finishQuiz() {
            imgElement.style.display = "none";
            transcriptDiv.innerText = "Το παιχνίδι τελείωσε!";
            messageDiv.innerText = `Τελικό Σκορ: ${score} / ${quizData.length}`;
            startBtn.style.display = "none";
        }

        initQuiz();
    </script>
</body>
</html>
