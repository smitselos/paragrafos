<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎮 Κουίζ Λέξεων με τη Σοφία</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

  :root {
    --bg:#FFF8E7;--card:#FFFFFF;--pink:#FF6B9D;--blue:#4ECDC4;--yellow:#FFD93D;
    --green:#6BCB77;--orange:#FF8C42;--purple:#A66CFF;--dark:#2D3436;--muted:#636E72;
    --shadow:0 4px 20px rgba(0,0,0,.08);--shadow-btn:0 6px 24px rgba(0,0,0,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Fredoka',sans-serif;background:var(--bg);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;pointer-events:none}
  body::before{width:280px;height:280px;background:var(--pink);top:-80px;right:-50px}
  body::after{width:220px;height:220px;background:var(--blue);bottom:-40px;left:-60px}
  .app{position:relative;z-index:1;width:100%;max-width:400px;padding:16px;display:flex;flex-direction:column;align-items:center;min-height:100dvh}
  .screen{display:none;flex-direction:column;align-items:center;width:100%}
  .screen.active{display:flex}

  /* ═══ AVATARS ═══ */
  .avatar-img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:4px solid var(--yellow);box-shadow:var(--shadow)}
  .avatar-img.small{width:40px;height:40px;border-width:2px}
  .sophia-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#FFE0EC,#FFB6D9);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:4px}

  /* ═══ WELCOME ═══ */
  .welcome{justify-content:center;text-align:center;flex:1;gap:10px;padding:20px 0}
  .welcome h1{font-size:1.8rem;font-weight:700;color:var(--dark)}
  .welcome p{font-size:1.1rem;color:var(--muted);line-height:1.6}

  /* ═══ PLAYER SELECT ═══ */
  .player-select{display:flex;gap:20px;margin:24px 0}
  .player-card{background:var(--card);border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--shadow);border:3px solid transparent;transition:all .2s}
  .player-card:active{transform:scale(.95)}
  .player-card .name{font-size:1.15rem;font-weight:700;color:var(--dark)}
  .player-card .age{font-size:.85rem;color:var(--muted);font-weight:500}
  .player-card.selected{border-color:var(--pink);background:#FFF0F5}

  /* ═══ BUTTONS ═══ */
  .btn-big{font-family:'Fredoka',sans-serif;font-size:1.3rem;font-weight:700;color:#fff;border:none;border-radius:50px;padding:18px 50px;cursor:pointer;box-shadow:var(--shadow-btn);transition:transform .15s}
  .btn-big:active{transform:scale(.94)}
  .btn-big:disabled{opacity:.4;pointer-events:none}
  .btn-start{background:linear-gradient(135deg,var(--green),var(--blue))}
  .btn-replay{background:linear-gradient(135deg,var(--orange),var(--yellow))}

  /* ═══ HEADER ═══ */
  .header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .header-left{display:flex;align-items:center;gap:8px}
  .player-name-sm{font-weight:700;font-size:.95rem;color:var(--dark)}
  .badge{font-weight:700;font-size:1rem;padding:8px 16px;border-radius:30px;box-shadow:var(--shadow)}
  .badge-score{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#fff}
  .badge-prog{background:var(--card);color:var(--dark);font-weight:600}
  .prog-track{width:100%;height:10px;background:rgba(0,0,0,.06);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:10px;transition:width .5s;width:0%}

  /* ═══ WORD CARD ═══ */
  .word-card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px 20px;width:100%;text-align:center;margin-bottom:14px;border:3px solid transparent;transition:border-color .3s}
  .word-card.correct{border-color:var(--green)}
  .word-card.wrong{border-color:var(--pink);animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .word-display{font-size:2rem;font-weight:700;color:var(--dark);margin:6px 0 4px;letter-spacing:2px}
  .word-display.emoji-big{font-size:4.5rem;letter-spacing:0}
  .word-hint{font-size:.9rem;color:var(--muted);font-weight:500;min-height:1.3em}
  .question-label{font-size:1.05rem;font-weight:600;color:var(--purple);margin-bottom:4px}

  /* ═══ SOPHIA BUBBLE ═══ */
  .bubble{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;width:100%;text-align:center;margin-bottom:14px;position:relative}
  .bubble::after{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:9px solid var(--card)}
  .bubble .msg{font-size:1.05rem;font-weight:500;color:var(--dark);line-height:1.5}
  .bubble .msg.ok{color:var(--green);font-weight:700}
  .bubble .msg.err{color:var(--pink);font-weight:600}

  /* ═══ CHOICES ═══ */
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:14px}
  .choice-btn{background:var(--card);border:3px solid #eee;border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s;box-shadow:var(--shadow)}
  .choice-btn:active{transform:scale(.93)}
  .choice-btn .choice-emoji{font-size:48px;line-height:1.1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
  .choice-btn .choice-label{font-family:'Fredoka',sans-serif;font-size:.9rem;font-weight:600;color:var(--dark)}
  .choice-btn.picked-correct{border-color:var(--green);background:#e8f9ee;animation:popOk .4s ease}
  .choice-btn.picked-wrong{border-color:var(--pink);background:#ffe8ee;animation:shake .4s ease}
  .choice-btn.reveal-correct{border-color:var(--green);background:#e8f9ee}
  .choice-btn.disabled{pointer-events:none;opacity:.5}
  @keyframes popOk{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

  .hint-btn{background:var(--card);border:2px dashed var(--yellow);border-radius:12px;padding:10px 20px;font-family:'Fredoka',sans-serif;font-size:.95rem;font-weight:600;color:var(--orange);cursor:pointer;margin-bottom:10px}
  .hint-btn:active{transform:scale(.95)}

  /* ═══ VOICE INPUT ═══ */
  .voice-input-area{width:100%;margin-bottom:14px}
  .voice-input-wrap{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .voice-input{flex:1;font-family:'Fredoka',sans-serif;font-size:1.2rem;padding:16px 18px;border:3px solid var(--purple);border-radius:16px;outline:none;background:var(--card);color:var(--dark);text-align:center;font-weight:600;transition:border-color .2s}
  .voice-input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,107,157,.15)}
  .voice-input.correct-input{border-color:var(--green);background:#e8f9ee;color:var(--green)}
  .voice-input.wrong-input{border-color:var(--pink);background:#ffe8ee;color:var(--pink)}
  .voice-check-btn{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:700;padding:16px 22px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;cursor:pointer;box-shadow:var(--shadow-btn);transition:transform .15s;white-space:nowrap}
  .voice-check-btn:active{transform:scale(.93)}
  .voice-check-btn:disabled{opacity:.4;pointer-events:none}
  .voice-hint-text{font-size:.82rem;color:var(--muted);text-align:center;font-weight:500}
  .voice-result{text-align:center;margin-top:8px;font-size:1rem;font-weight:600;min-height:1.3em}

  .home-btn{width:38px;height:38px;border-radius:50%;border:2px solid #eee;background:var(--card);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .15s}
  .home-btn:active{transform:scale(.9)}

  /* ═══ MODE ═══ */
  .mode-row{display:flex;gap:8px;margin-bottom:14px;width:100%}
  .mode-btn{flex:1;font-family:'Fredoka',sans-serif;font-size:.82rem;font-weight:600;padding:10px 6px;border-radius:12px;border:2px solid #ddd;background:var(--card);color:var(--dark);cursor:pointer;text-align:center;transition:all .2s}
  .mode-btn.active{border-color:var(--purple);background:var(--purple);color:#fff}
  .mode-btn:active{transform:scale(.95)}

  /* ═══ END ═══ */
  .end{justify-content:center;text-align:center;flex:1;gap:8px}
  .end .trophy{font-size:100px;margin-bottom:8px}
  .end h2{font-size:1.6rem;font-weight:700;color:var(--dark)}
  .end .final-score{font-size:2.5rem;font-weight:700;color:var(--green);margin-bottom:16px}
  .end .end-msg{color:var(--muted);font-size:1.05rem;margin-bottom:20px}

  /* ═══ STARS ═══ */
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
  .star{position:absolute;font-size:30px;animation:starFall 1s ease-out forwards}
  @keyframes starFall{0%{opacity:1;transform:translateY(0) scale(1) rotate(0)}100%{opacity:0;transform:translateY(130px) scale(.3) rotate(200deg)}}
</style>
</head>
<body>
<div class="app">

  <!-- ═══ WELCOME ═══ -->
  <div class="screen welcome active" id="scrWelcome">
    <div class="sophia-avatar" style="width:80px;height:80px;font-size:48px;margin-bottom:4px">👧</div>
    <h1>Γεια σας παιδιά!</h1>
    <p>Είμαι η <strong>Σοφία</strong>!<br>Θέλετε να παίξουμε με εικόνες και λέξεις;</p>
    <p style="font-size:1rem;color:var(--purple);font-weight:600;margin-top:8px">Ποια θα παίξει;</p>

    <div class="player-select">
      <div class="player-card" id="cardYlenia" onclick="selectPlayer('ylenia')">
        <img class="avatar-img" id="avatarYlenia" alt="Υλένια">
        <div class="name">Υλένια</div>
        <div class="age">5 ετών</div>
      </div>
      <div class="player-card" id="cardKaterina" onclick="selectPlayer('katerina')">
        <img class="avatar-img" id="avatarKaterina" alt="Κατερίνα">
        <div class="name">Κατερίνα</div>
        <div class="age">7,5 ετών</div>
      </div>
    </div>

    <button class="btn-big btn-start" id="btnStart" disabled onclick="startGame()">Πάμε! 🎉</button>
  </div>

  <!-- ═══ GAME ═══ -->
  <div class="screen" id="scrGame">
    <div class="header">
      <button class="home-btn" onclick="confirmHome()" title="Αρχική">🏠</button>
      <div class="header-left">
        <img class="avatar-img small" id="headerAvatar" alt="">
        <span class="player-name-sm" id="headerName"></span>
      </div>
      <div class="badge badge-score" id="elScore">⭐ 0</div>
    </div>
    <div style="width:100%;display:flex;justify-content:flex-end;margin-bottom:4px">
      <div class="badge badge-prog" id="elProg">1 / 15</div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="elBar"></div></div>

    <div class="mode-row">
      <button class="mode-btn active" id="modeImg" onclick="setMode('img')">🖼️ Βρες την εικόνα</button>
      <button class="mode-btn" id="modeWord" onclick="setMode('word')">🔤 Βρες τη λέξη</button>
      <button class="mode-btn" id="modeSay" onclick="setMode('say')">🎤 Πες τη λέξη</button>
    </div>

    <div class="word-card" id="elCard">
      <div class="question-label" id="elQuestion">Ποια εικόνα είναι σωστή;</div>
      <div class="word-display" id="elPrompt">ΓΑΤΑ</div>
      <div class="word-hint" id="elHintText"></div>
    </div>

    <div class="bubble" id="elBubble">
      <div class="sophia-avatar">👧</div>
      <div class="msg" id="elMsg">Πάτα τη σωστή εικόνα!</div>
    </div>

    <div class="choices" id="elChoices"></div>

    <!-- Voice/dictation input area -->
    <div class="voice-input-area" id="voiceArea" style="display:none">
      <div class="voice-input-wrap">
        <input type="text" id="voiceInput" class="voice-input" placeholder="Πάτα εδώ και μίλα 🎤" autocomplete="off" autocorrect="off" autocapitalize="none" inputmode="text">
        <button class="voice-check-btn" id="voiceCheckBtn" onclick="checkVoiceAnswer()">Έλεγξε ✓</button>
      </div>
      <div class="voice-hint-text">💡 Πάτα το πεδίο, μετά πάτα 🎤 στο πληκτρολόγιο</div>
      <div class="voice-result" id="voiceResult"></div>
    </div>

    <button class="hint-btn" onclick="giveHint()">💡 Βοήθεια</button>
  </div>

  <!-- ═══ END ═══ -->
  <div class="screen end" id="scrEnd">
    <div class="trophy">🏆</div>
    <h2 id="endTitle">Μπράβο!</h2>
    <div class="final-score" id="elFinal">0 / 15</div>
    <div class="end-msg" id="elEndMsg"></div>
    <button class="btn-big btn-replay" onclick="startGame()">Παίξε ξανά 🔄</button>
    <button class="btn-big btn-start" style="margin-top:12px;font-size:1rem;padding:14px 30px" onclick="backToWelcome()">Αλλαγή παίκτη 👋</button>
  </div>
</div>

<div class="stars" id="elStars"></div>

function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let currentPlayer = null; // 'ylenia' | 'katerina'
let list=[], idx=0, score=0, total=0, mode='img', locked=false, streak=0;

// ═══════════════════════════════════════
// TTS
// ═══════════════════════════════════════
const canSpeak = 'speechSynthesis' in window;
function speak(text, cb) {
  if(!canSpeak){if(cb)setTimeout(cb,400);return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[🎉🌟🤩😂🧠😮🧙‍♀️🐶🚀📚💃🕺💪🤔😊🎯😅👀🔍🥰😄😜🏆🥇🎊]/g,''));
  u.lang='el-GR';u.rate=0.9;u.pitch=1.2;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('el'));
  if(v)u.voice=v;
  if(cb)u.onend=cb;
  speechSynthesis.speak(u);
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function pickN(arr,n,exclude){return shuffle(arr.filter(x=>x!==exclude)).slice(0,n)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

// ═══════════════════════════════════════
// PLAYER SELECT
// ═══════════════════════════════════════
function selectPlayer(who) {
  currentPlayer = who;
  document.getElementById('cardYlenia').classList.toggle('selected', who==='ylenia');
  document.getElementById('cardKaterina').classList.toggle('selected', who==='katerina');
  document.getElementById('btnStart').disabled = false;

  const greet = who==='ylenia' ? pick(SOPHIA.greetYlenia) : pick(SOPHIA.greetKaterina);
  speak(greet);
}

// ═══════════════════════════════════════
// GAME
// ═══════════════════════════════════════
function startGame() {
  if(!currentPlayer) return;

  const isYoung = currentPlayer === 'ylenia';
  const wordPool = isYoung ? WORDS_EASY : WORDS_HARD;
  total = isYoung ? 12 : 18;

  list = shuffle(wordPool).slice(0, total);
  idx=0; score=0; streak=0; locked=false;
  mode='img';

  // Set header avatar
  const hdr = document.getElementById('headerAvatar');
  hdr.src = isYoung ? AVATAR_YLENIA : AVATAR_KATERINA;
  document.getElementById('headerName').textContent = isYoung ? 'Υλένια' : 'Κατερίνα';

  show('scrGame');
  // Εμφάνιση modes — Υλένια: μόνο εικόνα + πες τη λέξη (δεν διαβάζει)
  document.querySelector('.mode-row').style.display = 'flex';
  document.getElementById('modeWord').style.display = isYoung ? 'none' : '';
  updateMode();
  renderQuestion();

  const name = isYoung ? 'Υλένια' : 'Κατερίνα';
  speak('Τέλεια ' + name + '! Ας ξεκινήσουμε!');
}

function confirmHome(){
  if(idx>0 && idx<list.length){
    if(confirm('Θέλεις να σταματήσεις το παιχνίδι;')) backToWelcome();
  } else {
    backToWelcome();
  }
}

function backToWelcome() {
  currentPlayer = null;
  document.getElementById('cardYlenia').classList.remove('selected');
  document.getElementById('cardKaterina').classList.remove('selected');
  document.getElementById('btnStart').disabled = true;
  show('scrWelcome');
  speak('Ποια θα παίξει τώρα;');
}

function setMode(m){mode=m;updateMode();renderQuestion()}
function updateMode(){
  document.getElementById('modeImg').classList.toggle('active',mode==='img');
  document.getElementById('modeWord').classList.toggle('active',mode==='word');
  document.getElementById('modeSay').classList.toggle('active',mode==='say');
}

function renderQuestion(){
  locked=false;
  const item=list[idx];
  document.getElementById('elScore').textContent='⭐ '+score;
  document.getElementById('elProg').textContent=(idx+1)+' / '+total;
  document.getElementById('elBar').style.width=(idx/total*100)+'%';
  const card=document.getElementById('elCard');
  card.className='word-card';
  document.getElementById('elHintText').textContent='';
  const prompt=document.getElementById('elPrompt');
  prompt.className='word-display';

  // Show/hide areas based on mode
  const choicesEl=document.getElementById('elChoices');
  const voiceEl=document.getElementById('voiceArea');
  const voiceInp=document.getElementById('voiceInput');
  const voiceRes=document.getElementById('voiceResult');

  if(mode==='say'){
    choicesEl.style.display='none';
    voiceEl.style.display='block';
    voiceInp.value='';
    voiceInp.className='voice-input';
    voiceInp.disabled=false;
    voiceRes.textContent='';
    document.getElementById('voiceCheckBtn').disabled=false;
    document.getElementById('elQuestion').textContent='Τι είναι αυτό; Πες μου!';
    prompt.textContent=item.emoji;
    prompt.classList.add('emoji-big');
  } else {
    choicesEl.style.display='grid';
    voiceEl.style.display='none';
    if(mode==='img'){
      document.getElementById('elQuestion').textContent=currentPlayer==='ylenia'?'Πού είναι;':'Ποια εικόνα είναι σωστή;';
      prompt.textContent=item.word.toUpperCase();
      renderEmojiChoices(item);
    } else {
      document.getElementById('elQuestion').textContent='Ποια λέξη ταιριάζει;';
      prompt.textContent=item.emoji;
      prompt.classList.add('emoji-big');
      renderWordChoices(item);
    }
  }

  const msg=document.getElementById('elMsg');
  msg.className='msg';
  const playerName = currentPlayer==='ylenia' ? 'Υλένια' : 'Κατερίνα';
  if(mode==='say'){
    msg.textContent='Τι είναι αυτό; Πάτα και πες μου! 🎤';
    speak('Τι είναι αυτό;');
  } else if(currentPlayer==='ylenia'){
    msg.textContent='Πού είναι... '+item.word+'; 🔍';
    speak('Πού είναι... '+item.word+';');
  } else if(mode==='img'){
    const q=pick(SOPHIA.askQuestion);
    msg.textContent=q.includes('...')?q+item.word+';':q;
    speak(q.includes('...')?q+item.word:q);
  } else {
    msg.textContent='Τι είναι αυτό; 🤔';
    speak('Τι είναι αυτό;');
  }
}

function renderEmojiChoices(correct){
  const distractors=pickN(mode==='img'?list.concat(currentPlayer==='ylenia'?WORDS_EASY:WORDS_HARD):list,3,correct);
  const options=shuffle([correct,...distractors]);
  const c=document.getElementById('elChoices');c.innerHTML='';
  options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-emoji">${opt.emoji}</span>`;
    btn.onclick=()=>handleChoice(btn,opt,correct);
    c.appendChild(btn);
  });
}

function renderWordChoices(correct){
  const distractors=pickN(list.concat(currentPlayer==='ylenia'?WORDS_EASY:WORDS_HARD),3,correct);
  const options=shuffle([correct,...distractors]);
  const c=document.getElementById('elChoices');c.innerHTML='';
  options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-emoji">${opt.emoji}</span><span class="choice-label">${opt.word}</span>`;
    btn.onclick=()=>handleChoice(btn,opt,correct);
    c.appendChild(btn);
  });
}

function handleChoice(btn, chosen, correct){
  if(locked)return;
  locked=true;
  const allBtns=document.querySelectorAll('.choice-btn');

  if(chosen===correct){
    score++;streak++;
    btn.classList.add('picked-correct');
    allBtns.forEach(b=>{if(b!==btn)b.classList.add('disabled')});
    document.getElementById('elCard').className='word-card correct';
    document.getElementById('elScore').textContent='⭐ '+score;

    const msg=document.getElementById('elMsg');
    // Use jokes sometimes on streaks
    const praise = streak>2 && Math.random()>.5 ? pick(SOPHIA.correctJokes) : pick(SOPHIA.correct);
    msg.textContent=praise;
    msg.className='msg ok';

    showStars();
    const pName = currentPlayer==='ylenia' ? 'Υλένια' : 'Κατερίνα';
    speak('Μπράβο '+pName+'!', ()=>{setTimeout(nextQuestion,600)});
  } else {
    streak=0;
    btn.classList.add('picked-wrong');
    allBtns.forEach(b=>{
      if(b.querySelector('.choice-emoji').textContent===correct.emoji) b.classList.add('reveal-correct');
    });
    document.getElementById('elCard').className='word-card wrong';
    const msg=document.getElementById('elMsg');
    msg.textContent=pick(SOPHIA.wrong);
    msg.className='msg err';
    speak(pick(['Δοκίμασε ξανά!','Σχεδόν!','Ξαναπροσπάθησε!']));

    setTimeout(()=>{
      allBtns.forEach(b=>b.classList.remove('picked-wrong','reveal-correct','disabled'));
      document.getElementById('elCard').className='word-card';
      msg.textContent=pick(SOPHIA.encourage);
      msg.className='msg';
      locked=false;
    },1800);
  }
}

function nextQuestion(){
  idx++;
  if(idx>=list.length){endGame();return}
  renderQuestion();
}

function endGame(){
  show('scrEnd');
  const name = currentPlayer==='ylenia'?'Υλένια':'Κατερίνα';
  document.getElementById('elFinal').textContent=score+' / '+total;
  document.getElementById('elBar').style.width='100%';

  const pct=score/total;
  let m,t;
  if(pct===1){t='Τέλειο σκορ, '+name+'!';m='Είσαι ΣΟΥΠΕΡ! Δεν έκανες ούτε ένα λάθος! 🥇';}
  else if(pct>=.8){t='Μπράβο '+name+'!';m='Πολύ καλά! Σχεδόν τέλειο! Σε ζηλεύω! 🌟';}
  else if(pct>=.5){t='Καλή προσπάθεια!';m='Πολύ καλά '+name+'! Την επόμενη φορά ακόμα καλύτερα! 💪';}
  else{t='Μην ανησυχείς!';m='Θα εξασκηθούμε '+name+'! Κάθε φορά γίνεσαι καλύτερη! 😊';}

  document.getElementById('endTitle').textContent=t;
  document.getElementById('elEndMsg').textContent=m;
  speak(t+' '+m);
}

// ═══ VOICE/DICTATION ANSWER CHECK ═══
function normalize(text){
  return text.toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // αφαίρεση τόνων
    .replace(/\s+/g,' ');
}

function checkVoiceAnswer(){
  if(locked)return;
  const inp=document.getElementById('voiceInput');
  const text=inp.value.trim();
  if(!text)return;

  locked=true;
  const item=list[idx];
  const normSpoken=normalize(text);

  // Ελεγχος: accept list + κύρια λέξη
  const allAccept=[item.word, ...(item.accept||[])];
  let correct=false;
  for(const variant of allAccept){
    const nv=normalize(variant);
    if(normSpoken.includes(nv)||nv.includes(normSpoken)){correct=true;break;}
  }

  const card=document.getElementById('elCard');
  const msg=document.getElementById('elMsg');
  const voiceRes=document.getElementById('voiceResult');
  const checkBtn=document.getElementById('voiceCheckBtn');

  if(correct){
    score++;streak++;
    inp.className='voice-input correct-input';
    inp.disabled=true;
    checkBtn.disabled=true;
    card.className='word-card correct';
    document.getElementById('elScore').textContent='⭐ '+score;

    const praise=streak>2&&Math.random()>.5?pick(SOPHIA.correctJokes):pick(SOPHIA.correct);
    msg.textContent=praise;
    msg.className='msg ok';
    voiceRes.innerHTML='<span style="color:var(--green)">✅ Σωστά!</span>';

    showStars();
    const pName=currentPlayer==='ylenia'?'Υλένια':'Κατερίνα';
    speak('Μπράβο '+pName+'!',()=>{setTimeout(nextQuestion,600)});
  } else {
    streak=0;
    inp.className='voice-input wrong-input';
    card.className='word-card wrong';
    msg.textContent=pick(SOPHIA.wrong);
    msg.className='msg err';
    voiceRes.innerHTML='<span style="color:var(--pink)">Ξαναδοκίμασε! 💪</span>';
    speak(pick(['Δοκίμασε ξανά!','Σχεδόν!','Ξαναπροσπάθησε!']));

    setTimeout(()=>{
      inp.className='voice-input';
      inp.value='';
      inp.disabled=false;
      card.className='word-card';
      msg.textContent=pick(SOPHIA.encourage);
      msg.className='msg';
      voiceRes.textContent='';
      locked=false;
      inp.focus();
    },1800);
  }
}

function giveHint(){
  const item=list[idx];
  document.getElementById('elHintText').textContent='💡 '+item.hint;
  speak(item.hint);
}

function showStars(){
  const c=document.getElementById('elStars');
  const em=['⭐','🌟','✨','💫','🎉','🎊'];
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='star';
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left=(Math.random()*90+5)+'%';
    s.style.top=(Math.random()*40+10)+'%';
    s.style.animationDelay=(Math.random()*.4)+'s';
    c.appendChild(s);setTimeout(()=>s.remove(),1500);
  }
}

// ═══ INIT ═══
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&mode==='say'&&!locked){checkVoiceAnswer();}
});

if(canSpeak){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>{};
  setTimeout(()=>{
    speak('Γεια σας παιδιά! Είμαι η Σοφία!', ()=>{
      setTimeout(()=>speak('Θέλετε... να παίξουμε;'),400);
    });
  },600);
}
