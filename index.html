<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Ανάλυσης Παραγράφου - Α' Λυκείου</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 16px;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header h1 { font-size: 1.5rem; color: #1e293b; }
        .header-subtitle { color: #64748b; font-size: 0.875rem; }
        .question-counter { text-align: right; }
        .question-counter span { font-size: 1.75rem; font-weight: 700; color: #4f46e5; }
        .progress-bar { background: #e2e8f0; border-radius: 999px; height: 8px; margin-top: 16px; overflow: hidden; }
        .progress-fill { background: #4f46e5; height: 100%; transition: width 0.3s ease; }
        .selection-screen { text-align: center; }
        .selection-screen h2 { color: #1e293b; margin-bottom: 8px; font-size: 1.75rem; }
        .selection-screen p { color: #64748b; margin-bottom: 24px; }
        .filter-section { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left; }
        .filter-section h3 { color: #374151; font-size: 1rem; margin-bottom: 12px; }
        .filter-options { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn { padding: 10px 16px; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .filter-btn:hover { border-color: #94a3b8; }
        .filter-btn.selected { border-color: #4f46e5; background: #4f46e5; color: white; font-weight: 600; }
        .start-btn { width: 100%; padding: 18px; border: none; border-radius: 12px; background: #4f46e5; color: white; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        .start-btn:hover { background: #3730a3; }
        .start-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        .count-info { background: #ecfdf5; color: #065f46; padding: 12px; border-radius: 8px; margin-top: 16px; font-weight: 500; }
        .count-info.warning { background: #fef3c7; color: #92400e; }
        .loading { text-align: center; padding: 60px 20px; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .paragraph-label { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 4px 12px; border-radius: 6px; font-size: 0.875rem; font-weight: 600; margin-bottom: 12px; }
        .syndyasmos-badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; margin-left: 8px; }
        .paragraph-text { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); color: #1e293b; padding: 20px; border-radius: 12px; text-align: justify; line-height: 1.9; font-size: 1rem; border-left: 4px solid #4f46e5; box-shadow: 0 2px 8px rgba(0,0,0,0.06); -webkit-user-select: none; user-select: none; }
        .questions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .question-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px; border: 2px solid transparent; }
        .question-card.correct { background: #dcfce7; border-color: #22c55e; }
        .question-card.incorrect { background: #fee2e2; border-color: #ef4444; }
        .question-card.partial { background: #fef9c3; border-color: #eab308; }
        .question-card h3 { color: #374151; font-size: 1rem; margin-bottom: 12px; }
        .multi-select-hint { font-size: 0.75rem; color: #6b7280; margin-bottom: 10px; font-style: italic; }
        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .option-btn { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; background: white; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; position: relative; }
        .option-btn:hover:not(:disabled) { border-color: #94a3b8; }
        .option-btn.selected { border-color: #4f46e5; background: #eef2ff; }
        .option-btn.correct-answer { border-color: #047857; background: #059669; color: white; font-weight: 600; animation: glow 1.5s ease-in-out infinite; }
        @keyframes glow { 0%,100%{box-shadow:0 0 5px #059669,0 0 10px #059669} 50%{box-shadow:0 0 10px #10b981,0 0 20px #10b981,0 0 30px #10b981} }
        .option-btn.wrong-answer { border-color: #b91c1c; background: #dc2626; color: white; font-weight: 600; }
        .option-btn:disabled { cursor: default; }
        .option-hint { font-size: 0.75rem; color: #64748b; margin-left: 8px; }
        .option-btn.correct-answer .option-hint, .option-btn.wrong-answer .option-hint { color: rgba(255,255,255,0.8); }
        .tropos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .tropos-btn { padding: 10px 8px; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; position: relative; }
        .tropos-btn:hover:not(:disabled) { border-color: #94a3b8; }
        .tropos-btn.selected { border-color: #7c3aed; background: #f3e8ff; }
        .tropos-btn.selected-primary { border-color: #7c3aed; background: #ddd6fe; }
        .tropos-btn.correct-answer, .tropos-btn.correct-primary { border-color: #047857; background: #059669; color: white; font-weight: 600; animation: glow 1.5s ease-in-out infinite; }
        .tropos-btn.wrong-answer { border-color: #b91c1c; background: #dc2626; color: white; font-weight: 600; }
        .tropos-btn:disabled { cursor: default; }
        .selection-order { position: absolute; top: -8px; right: -8px; background: #7c3aed; color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .main-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .main-btn.primary { background: #4f46e5; color: white; }
        .main-btn.primary:hover { background: #3730a3; }
        .main-btn.success { background: #16a34a; color: white; }
        .main-btn.success:hover { background: #15803d; }
        .main-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        .feedback-section { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
        .feedback-section h3 { color: #1e293b; font-size: 1.2rem; margin-bottom: 16px; }
        .feedback-box { padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .feedback-box.blue { background: #eff6ff; }
        .feedback-box.purple { background: #faf5ff; }
        .feedback-box.green { background: #ecfdf5; }
        .feedback-box.amber { background: #fffbeb; }
        .feedback-box h4 { font-size: 0.95rem; margin-bottom: 8px; }
        .feedback-box.blue h4 { color: #1e40af; }
        .feedback-box.purple h4 { color: #6b21a8; }
        .feedback-box.green h4 { color: #065f46; }
        .feedback-box.amber h4 { color: #92400e; }
        .feedback-box p { font-size: 0.875rem; color: #374151; margin-bottom: 6px; }
        .tropos-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-right: 6px; }
        .tropos-tag.primary { background: #ddd6fe; color: #5b21b6; }
        .tropos-tag.secondary { background: #e0e7ff; color: #3730a3; }
        .results-card { text-align: center; padding: 40px 24px; }
        .results-emoji { font-size: 4rem; margin-bottom: 16px; }
        .results-title { font-size: 1.75rem; color: #1e293b; margin-bottom: 24px; }
        .results-score-box { background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .results-score { font-size: 3rem; font-weight: 700; color: #4f46e5; }
        .results-percentage { color: #64748b; font-size: 1.1rem; }
        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .detail-box { padding: 16px; border-radius: 12px; }
        .detail-box.blue { background: #eff6ff; }
        .detail-box.purple { background: #faf5ff; }
        .detail-box.green { background: #ecfdf5; }
        .detail-box p:first-child { font-size: 0.8rem; font-weight: 500; }
        .detail-box.blue p:first-child { color: #2563eb; }
        .detail-box.purple p:first-child { color: #7c3aed; }
        .detail-box.green p:first-child { color: #059669; }
        .detail-box p:last-child { font-size: 1.5rem; font-weight: 700; }
        .detail-box.blue p:last-child { color: #1d4ed8; }
        .detail-box.purple p:last-child { color: #6b21a8; }
        .detail-box.green p:last-child { color: #047857; }
        .theory-toggle { background: none; border: none; color: #4f46e5; cursor: pointer; font-size: 0.875rem; font-weight: 500; padding: 8px 0; }
        .theory-box { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 16px; margin-bottom: 20px; font-size: 0.875rem; }
        .theory-box h3 { color: #92400e; margin-bottom: 12px; }
        .theory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .theory-box ul { margin-left: 20px; color: #78350f; }
        .theory-box li { margin-bottom: 4px; font-size: 0.8rem; }
        .print-btn { background: #059669; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 10px; width: 100%; }
        .print-btn:hover { background: #047857; }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .tropos-grid { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: 1fr; }
            .filter-options { flex-direction: column; }
            .filter-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="card loading">
            <div class="loading-spinner"></div>
            <p>Φόρτωση δεδομένων...</p>
        </div>
    </div>

    <script>
        // =====================================================
        // ΡΥΘΜΙΣΕΙΣ
        // =====================================================
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTF385Wqk5c-makn7m3cxaDD35hr3LFyjKtR3r6cplVW4ZtGwEbcdqvHhvVztdbM5uxNrs8gxxoYHuW/pub?gid=176063284&single=true&output=csv';

        const tropoiAnaptyxis = [
            "Παραδείγματα",
            "Αιτιολόγηση",
            "Αίτιο-αποτέλεσμα",
            "Διαίρεση",
            "Σύγκριση-αντίθεση",
            "Αναλογία",
            "Ορισμός"
        ];

        let allData = [];
        let quizData = [];

        let state = {
            screen: 'loading',
            selectedDomiFilter: 'all',
            selectedTroposFilter: 'all',
            selectedCount: 10,
            selectedDifficulty: 'all',
            currentQuestion: 0,
            selectedDomi: null,
            selectedTropoi: [],
            showResult: false,
            score: { domi: 0, tropiKyrios: 0, tropiDeytereyon: 0 },
            showTheory: false
        };

        // =====================================================
        // DATA LOADING — απευθείας από published CSV (χωρίς proxy)
        // =====================================================
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += c;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim());
            if (lines.length < 2) return [];
            const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const vals = parseCSVLine(lines[i]);
                const obj = {};
                headers.forEach((h, idx) => {
                    let v = (vals[idx] || '').trim();
                    obj[h] = (v === '' || v.toLowerCase() === 'null') ? null : v;
                });
                if (obj.keimeno && obj.domi && obj.kyrios) data.push(obj);
            }
            return data;
        }

        async function loadData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const csv = await response.text();
                allData = parseCSV(csv);
                if (allData.length === 0) throw new Error('Κενά δεδομένα');
                state.screen = 'selection';
            } catch (e) {
                document.getElementById('app').innerHTML = `
                    <div class="card" style="text-align:center; padding:40px">
                        <p style="color:#ef4444; font-size:1.1rem; margin-bottom:16px">⚠️ Αδυναμία φόρτωσης δεδομένων</p>
                        <p style="color:#64748b; font-size:0.9rem">${e.message}</p>
                        <button onclick="loadData()" style="margin-top:20px; padding:12px 24px; background:#4f46e5; color:white; border:none; border-radius:8px; cursor:pointer; font-size:1rem">Επανάληψη</button>
                    </div>`;
                return;
            }
            render();
        }

        function shuffleArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // =====================================================
        // FILTERING
        // =====================================================
        function getFilteredData() {
            let filtered = [...allData];
            if (state.selectedDomiFilter !== 'all')
                filtered = filtered.filter(item => item.domi === state.selectedDomiFilter);
            if (state.selectedTroposFilter === 'syndyasmos')
                filtered = filtered.filter(item => item.deytereyon !== null);
            else if (state.selectedTroposFilter !== 'all')
                filtered = filtered.filter(item => item.kyrios === state.selectedTroposFilter);
            if (state.selectedDifficulty !== 'all')
                filtered = filtered.filter(item => item.dyskoleia === state.selectedDifficulty);
            return filtered;
        }

        function hasSyndyasmos(q) { return q.deytereyon !== null; }

        // =====================================================
        // RENDERING
        // =====================================================
        function render() {
            const app = document.getElementById('app');
            switch (state.screen) {
                case 'loading':   app.innerHTML = renderLoading(); break;
                case 'selection': app.innerHTML = renderSelection(); break;
                case 'quiz':      app.innerHTML = renderQuiz(); break;
                case 'results':   app.innerHTML = renderResults(); break;
            }
            attachEventListeners();
        }

        function renderLoading() {
            return `<div class="card loading"><div class="loading-spinner"></div><p>Φόρτωση δεδομένων...</p></div>`;
        }

        function renderSelection() {
            const filteredCount = getFilteredData().length;
            return `
                <div class="card selection-screen">
                    <h2>📝 Quiz Ανάλυσης Παραγράφου</h2>
                    <p>Νεοελληνική Γλώσσα - Λύκειο</p>
                    <div class="filter-section">
                        <h3>📐 Επιλέξτε Δομή</h3>
                        <div class="filter-options">
                            <button class="filter-btn ${state.selectedDomiFilter==='all'?'selected':''}" data-domi-filter="all">Όλες</button>
                            <button class="filter-btn ${state.selectedDomiFilter==='Διμερής'?'selected':''}" data-domi-filter="Διμερής">Διμερής</button>
                            <button class="filter-btn ${state.selectedDomiFilter==='Τριμερής'?'selected':''}" data-domi-filter="Τριμερής">Τριμερής</button>
                        </div>
                    </div>
                    <div class="filter-section">
                        <h3>📚 Επιλέξτε Τρόπο Ανάπτυξης</h3>
                        <div class="filter-options">
                            <button class="filter-btn ${state.selectedTroposFilter==='all'?'selected':''}" data-tropos-filter="all">Όλοι</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Αιτιολόγηση'?'selected':''}" data-tropos-filter="Αιτιολόγηση">Αιτιολόγηση</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Αίτιο-αποτέλεσμα'?'selected':''}" data-tropos-filter="Αίτιο-αποτέλεσμα">Αίτιο-αποτέλεσμα</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Διαίρεση'?'selected':''}" data-tropos-filter="Διαίρεση">Διαίρεση</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Παραδείγματα'?'selected':''}" data-tropos-filter="Παραδείγματα">Παραδείγματα</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Σύγκριση-αντίθεση'?'selected':''}" data-tropos-filter="Σύγκριση-αντίθεση">Σύγκριση-αντίθεση</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Αναλογία'?'selected':''}" data-tropos-filter="Αναλογία">Αναλογία</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='Ορισμός'?'selected':''}" data-tropos-filter="Ορισμός">Ορισμός</button>
                            <button class="filter-btn ${state.selectedTroposFilter==='syndyasmos'?'selected':''}" data-tropos-filter="syndyasmos">Συνδυασμός</button>
                        </div>
                    </div>
                    <div class="filter-section">
                        <h3>🔢 Αριθμός Παραγράφων</h3>
                        <div class="filter-options">
                            <button class="filter-btn ${state.selectedCount===1?'selected':''}" data-count="1">1</button>
                            <button class="filter-btn ${state.selectedCount===10?'selected':''}" data-count="10">10</button>
                            <button class="filter-btn ${state.selectedCount===20?'selected':''}" data-count="20">20</button>
                        </div>
                    </div>
                    <div class="count-info ${filteredCount===0?'warning':''}">
                        ${filteredCount>0
                            ? `✅ Βρέθηκαν <strong>${filteredCount}</strong> παράγραφοι ${filteredCount<state.selectedCount?'(θα εμφανιστούν όλες)':`(θα εμφανιστούν ${state.selectedCount})`}`
                            : '⚠️ Δεν βρέθηκαν παράγραφοι με αυτά τα κριτήρια'}
                    </div>
                    <button class="start-btn" id="startBtn" ${filteredCount===0?'disabled':''}>Ξεκινήστε το Quiz</button>
                    <button class="print-btn" id="printBtn" ${filteredCount===0?'disabled':''}>🖨️ Εκτύπωση Άσκησης (Φύλλο Εργασίας)</button>
                </div>`;
        }

        function renderQuiz() {
            const current = quizData[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / quizData.length) * 100;
            const isSyndyasmos = hasSyndyasmos(current);
            return `
                <div class="card">
                    <div class="header">
                        <div>
                            <h1>📝 Ανάλυση Παραγράφου</h1>
                            <p class="header-subtitle">Νεοελληνική Γλώσσα - Λύκειο</p>
                        </div>
                        <div class="question-counter">
                            <p style="color:#64748b;font-size:0.875rem">Ερώτηση</p>
                            <span>${state.currentQuestion+1}/${quizData.length}</span>
                        </div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                </div>
                <button class="theory-toggle" id="theoryToggle">${state.showTheory?'▼':'▶'} Βοήθεια: Θεωρητικό Πλαίσιο</button>
                ${state.showTheory ? `
                <div class="theory-box">
                    <h3>📚 Υπενθύμιση</h3>
                    <div class="theory-grid">
                        <div>
                            <p style="font-weight:600;margin-bottom:8px;color:#92400e">Δομή Παραγράφου:</p>
                            <ul>
                                <li><strong>Τριμερής:</strong> Θεματική + Σχόλια + Κατακλείδα</li>
                                <li><strong>Διμερής:</strong> Θεματική + Σχόλια (χωρίς κατακλείδα)</li>
                            </ul>
                        </div>
                        <div>
                            <p style="font-weight:600;margin-bottom:8px;color:#92400e">Συνδυασμός Μεθόδων:</p>
                            <ul>
                                <li>Μία <strong>κύρια</strong> μέθοδος (βασική πρόθεση)</li>
                                <li>Μία ή περισσότερες <strong>δευτερεύουσες</strong></li>
                            </ul>
                        </div>
                    </div>
                </div>` : ''}
                <div class="card">
                    <span class="paragraph-label">Παράγραφος ${state.currentQuestion+1}</span>
                    ${isSyndyasmos?'<span class="syndyasmos-badge">⚡ Συνδυασμός μεθόδων</span>':''}
                    <p class="paragraph-text">${current.keimeno}</p>
                </div>
                <div class="questions-grid">
                    <div class="question-card ${state.showResult?(state.selectedDomi===current.domi?'correct':'incorrect'):''}">
                        <h3>1️⃣ Ποια είναι η δομή της παραγράφου;</h3>
                        <div class="options-list">
                            ${['Τριμερής','Διμερής'].map(d => {
                                const isCorrect = state.showResult && d === current.domi;
                                const isWrong = state.showResult && state.selectedDomi === d && d !== current.domi;
                                return `<button class="option-btn ${state.selectedDomi===d&&!state.showResult?'selected':''} ${isCorrect?'correct-answer':''} ${isWrong?'wrong-answer':''}"
                                    data-domi="${d}" ${state.showResult?'disabled':''}>
                                    ${d} <span class="option-hint">${d==='Τριμερής'?'(με κατακλείδα)':'(χωρίς κατακλείδα)'}</span>
                                </button>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="question-card ${state.showResult?getTroposResultClass(current):''}">
                        <h3>2️⃣ Ποιος είναι ο τρόπος ανάπτυξης;</h3>
                        <p class="multi-select-hint">💡 Επίλεξε με τη σειρά: 1ος = κύριος, 2ος = δευτερεύων (αν υπάρχει)</p>
                        <div class="tropos-grid">
                            ${tropoiAnaptyxis.map(tropos => {
                                const selIndex = state.selectedTropoi.indexOf(tropos);
                                const isSelected = selIndex !== -1;
                                const isPrimary = selIndex === 0;
                                const isCorrectK = tropos === current.kyrios;
                                const isCorrectD = tropos === current.deytereyon;
                                const isWrong = state.showResult && isSelected && !isCorrectK && !isCorrectD;
                                let cls = 'tropos-btn';
                                if (!state.showResult && isSelected) cls += isPrimary?' selected-primary':' selected';
                                if (state.showResult) {
                                    if (isCorrectK) cls += ' correct-primary';
                                    else if (isCorrectD) cls += ' correct-answer';
                                    else if (isWrong) cls += ' wrong-answer';
                                }
                                return `<button class="${cls}" data-tropos="${tropos}" ${state.showResult?'disabled':''}>
                                    ${tropos}
                                    ${isSelected&&!state.showResult?`<span class="selection-order">${selIndex+1}</span>`:''}
                                </button>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
                ${!state.showResult ? `
                    <button class="main-btn primary" id="checkBtn" ${!state.selectedDomi||state.selectedTropoi.length===0?'disabled':''}>Έλεγχος Απάντησης</button>
                ` : `
                    <div class="feedback-section">
                        <h3>📋 Ανάλυση Απάντησης</h3>
                        <div class="feedback-box blue">
                            <h4>${state.selectedDomi===current.domi?'✅':'❌'} Δομή: ${current.domi}</h4>
                            ${current.thematiki?`<p><strong>Θεματική:</strong> ${current.thematiki}</p>`:''}
                            ${current.scholia?`<p><strong>Σχόλια:</strong> ${current.scholia}</p>`:''}
                            ${current.katakleida?`<p><strong>Κατακλείδα:</strong> ${current.katakleida}</p>`:''}
                        </div>
                        <div class="feedback-box purple">
                            <h4>Τρόπος/οι Ανάπτυξης:</h4>
                            <p>
                                <span class="tropos-tag primary">Κύριος: ${current.kyrios}</span>
                                ${current.deytereyon?`<span class="tropos-tag secondary">Δευτερεύων: ${current.deytereyon}</span>`:''}
                            </p>
                            ${current.aitiologisi?`<p style="margin-top:10px">${current.aitiologisi}</p>`:''}
                        </div>
                        <div class="feedback-box amber">
                            <h4>📊 Η επιλογή σου:</h4>
                            <p>
                                ${state.selectedTropoi.length>0?`<span class="tropos-tag primary">1ος: ${state.selectedTropoi[0]}</span>`:''}
                                ${state.selectedTropoi.length>1?`<span class="tropos-tag secondary">2ος: ${state.selectedTropoi[1]}</span>`:''}
                            </p>
                            <p style="margin-top:8px">
                                Κύριος: ${state.selectedTropoi[0]===current.kyrios?'✅ Σωστά':'❌ Λάθος'}
                                ${current.deytereyon?` | Δευτερεύων: ${state.selectedTropoi[1]===current.deytereyon?'✅ Σωστά':(state.selectedTropoi.length<2?'⚠️ Δεν επιλέχθηκε':'❌ Λάθος')}`:''}
                            </p>
                        </div>
                        ${current.prothesi?`<div class="feedback-box green"><h4>🎯 Πρόθεση Συντάκτη</h4><p>${current.prothesi}</p></div>`:''}
                    </div>
                    <button class="main-btn success" id="nextBtn">
                        ${state.currentQuestion<quizData.length-1?'Επόμενη Ερώτηση →':'Δες τα Αποτελέσματα'}
                    </button>
                `}`;
        }

        function getTroposResultClass(current) {
            const kOk = state.selectedTropoi[0] === current.kyrios;
            const dOk = !current.deytereyon || state.selectedTropoi[1] === current.deytereyon;
            if (kOk && dOk) return 'correct';
            if (kOk || (current.deytereyon && state.selectedTropoi.includes(current.deytereyon))) return 'partial';
            return 'incorrect';
        }

        function renderResults() {
            const maxD = quizData.length;
            const maxK = quizData.length;
            const maxDey = quizData.filter(q => q.deytereyon).length;
            const total = state.score.domi + state.score.tropiKyrios + state.score.tropiDeytereyon;
            const max = maxD + maxK + maxDey;
            const pct = Math.round((total/max)*100);
            const emoji = pct>=80?'🎉':pct>=60?'👍':'📚';
            return `
                <div class="card results-card">
                    <div class="results-emoji">${emoji}</div>
                    <h2 class="results-title">Ολοκλήρωσες το Quiz!</h2>
                    <div class="results-score-box">
                        <p class="results-score">${total} / ${max}</p>
                        <p class="results-percentage">(${pct}%)</p>
                    </div>
                    <div class="results-grid">
                        <div class="detail-box blue"><p>Δομή</p><p>${state.score.domi}/${maxD}</p></div>
                        <div class="detail-box purple"><p>Κύριος Τρόπος</p><p>${state.score.tropiKyrios}/${maxK}</p></div>
                        <div class="detail-box green"><p>Δευτερεύων</p><p>${state.score.tropiDeytereyon}/${maxDey}</p></div>
                    </div>
                    <button class="main-btn primary" id="restartBtn" style="margin-bottom:12px">Ξεκίνα Ξανά</button>
                    <button class="main-btn" id="newSelectionBtn" style="background:#64748b;color:white">Νέα Επιλογή Κριτηρίων</button>
                </div>`;
        }

        // =====================================================
        // EVENT LISTENERS
        // =====================================================
        function attachEventListeners() {
            document.querySelectorAll('[data-domi-filter]').forEach(btn =>
                btn.addEventListener('click', () => { state.selectedDomiFilter = btn.dataset.domiFilter; render(); }));
            document.querySelectorAll('[data-tropos-filter]').forEach(btn =>
                btn.addEventListener('click', () => { state.selectedTroposFilter = btn.dataset.troposFilter; render(); }));
            document.querySelectorAll('[data-count]').forEach(btn =>
                btn.addEventListener('click', () => { state.selectedCount = parseInt(btn.dataset.count); render(); }));
            document.querySelectorAll('[data-difficulty]').forEach(btn =>
                btn.addEventListener('click', () => { state.selectedDifficulty = btn.dataset.difficulty; render(); }));

            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.addEventListener('click', () => {
                quizData = shuffleArray(getFilteredData()).slice(0, state.selectedCount);
                state.screen = 'quiz';
                state.currentQuestion = 0;
                state.selectedDomi = null;
                state.selectedTropoi = [];
                state.showResult = false;
                state.score = { domi:0, tropiKyrios:0, tropiDeytereyon:0 };
                render();
            });

            const printBtn = document.getElementById('printBtn');
            if (printBtn) printBtn.addEventListener('click', () => {
                printWorksheet(shuffleArray(getFilteredData()).slice(0, state.selectedCount));
            });

            const theoryToggle = document.getElementById('theoryToggle');
            if (theoryToggle) theoryToggle.addEventListener('click', () => { state.showTheory = !state.showTheory; render(); });

            document.querySelectorAll('[data-domi]').forEach(btn =>
                btn.addEventListener('click', () => { state.selectedDomi = btn.dataset.domi; render(); }));

            document.querySelectorAll('[data-tropos]').forEach(btn =>
                btn.addEventListener('click', () => {
                    const t = btn.dataset.tropos;
                    const idx = state.selectedTropoi.indexOf(t);
                    if (idx !== -1) state.selectedTropoi.splice(idx, 1);
                    else if (state.selectedTropoi.length < 2) state.selectedTropoi.push(t);
                    else state.selectedTropoi[1] = t;
                    render();
                }));

            const checkBtn = document.getElementById('checkBtn');
            if (checkBtn) checkBtn.addEventListener('click', () => {
                const c = quizData[state.currentQuestion];
                if (state.selectedDomi === c.domi) state.score.domi++;
                if (state.selectedTropoi[0] === c.kyrios) state.score.tropiKyrios++;
                if (c.deytereyon && state.selectedTropoi[1] === c.deytereyon) state.score.tropiDeytereyon++;
                state.showResult = true;
                render();
            });

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.addEventListener('click', () => {
                if (state.currentQuestion < quizData.length - 1) {
                    state.currentQuestion++;
                    state.selectedDomi = null;
                    state.selectedTropoi = [];
                    state.showResult = false;
                } else {
                    state.screen = 'results';
                }
                render();
            });

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.addEventListener('click', () => {
                quizData = shuffleArray(getFilteredData()).slice(0, state.selectedCount);
                state.currentQuestion = 0; state.selectedDomi = null; state.selectedTropoi = [];
                state.showResult = false; state.score = {domi:0,tropiKyrios:0,tropiDeytereyon:0};
                state.screen = 'quiz'; render();
            });

            const newSelectionBtn = document.getElementById('newSelectionBtn');
            if (newSelectionBtn) newSelectionBtn.addEventListener('click', () => {
                state.screen = 'selection'; state.currentQuestion = 0; state.selectedDomi = null;
                state.selectedTropoi = []; state.showResult = false;
                state.score = {domi:0,tropiKyrios:0,tropiDeytereyon:0}; render();
            });
        }

        // =====================================================
        // PRINT WORKSHEET
        // =====================================================
        function printWorksheet(data) {
            const w = window.open('', '_blank');
            w.document.write(`<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><title>ΑΣΚΗΣΗ - Ανάλυση Παραγράφου</title>
            <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Times New Roman',serif;padding:40px;line-height:1.6}
            .title{text-align:center;font-size:18pt;font-weight:bold;margin-bottom:20px}
            .instructions{font-size:11pt;text-align:justify;margin-bottom:30px;line-height:1.8}
            .par{margin-bottom:25px;page-break-inside:avoid}
            .par-num{font-size:11pt;font-weight:bold;margin-bottom:8px}
            .par-text{font-size:11pt;line-height:1.8;text-align:justify}
            @media print{.no-print{display:none}}</style></head><body>
            <div class="title">ΑΣΚΗΣΗ</div>
            <div class="instructions">Να εντοπίσετε τη δομή και τον τρόπο ή τους τρόπους ανάπτυξης της παραγράφου και να τους αιτιολογήσετε με βάση την πρόθεση του συντάκτη.</div>
            ${data.map((item,i)=>`<div class="par"><div class="par-num">Παράγραφος ${i+1}</div><div class="par-text">${item.keimeno}</div></div>`).join('')}
            <button class="no-print" onclick="window.print()" style="position:fixed;top:20px;right:20px;padding:15px 30px;font-size:16px;background:#4f46e5;color:white;border:none;border-radius:8px;cursor:pointer">🖨️ Εκτύπωση</button>
            </body></html>`);
            w.document.close();
        }

        // =====================================================
        // INIT
        // =====================================================
        loadData();
    </script>
</body>
</html>
